name: Deploy Collegium to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        env:
          VITE_COLLEGIUM_BASE: /${{ github.event.repository.name }}/
          VITE_COLLEGIUM_DEMO: "1"
          # Mapbox public token (pk.*) — referrer-restricted server-side,
          # safe to ship in client bundle. Set as a repo secret named
          # VITE_MAPBOX_TOKEN.
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          # Proxy URL overrides. By default the Auxilium client points
          # at the Supabase Edge Functions in supabase/functions/
          # (auxilium-deepl, auxilium-resend, auxilium-perplexity),
          # using VITE_SUPABASE_URL + the function name. These env vars
          # are an explicit override — set them if you want to route
          # to a self-hosted Worker or a different backend. Leaving
          # them unset is the right default once the repo is in
          # Lovable. See docs/lovable-setup.md.
          VITE_DEEPL_PROXY_URL: ${{ secrets.VITE_DEEPL_PROXY_URL }}
          VITE_RESEND_PROXY_URL: ${{ secrets.VITE_RESEND_PROXY_URL }}
          VITE_PERPLEXITY_PROXY_URL: ${{ secrets.VITE_PERPLEXITY_PROXY_URL }}
        run: npm run build

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
