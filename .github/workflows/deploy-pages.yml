name: Deploy Collegium to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        env:
          VITE_COLLEGIUM_BASE: /${{ github.event.repository.name }}/
          VITE_COLLEGIUM_DEMO: "1"
          # Mapbox public token (pk.*) — referrer-restricted server-side,
          # safe to ship in client bundle. Set as a repo secret named
          # VITE_MAPBOX_TOKEN.
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          # DeepL translation proxy. Holds the DeepL API key server-side;
          # client POSTs { text, target_lang, source_lang } and receives
          # { translations: [{text}] }.
          VITE_DEEPL_PROXY_URL: ${{ secrets.VITE_DEEPL_PROXY_URL }}
          # Resend email proxy. Holds the Resend API key server-side;
          # client POSTs { to, subject, text, from, reply_to } and
          # receives Resend's response. See docs/resend-worker.md for
          # the ~30-line Cloudflare Worker.
          VITE_RESEND_PROXY_URL: ${{ secrets.VITE_RESEND_PROXY_URL }}
          # Perplexity proxy (Sonar with citations) — used by the local
          # legal-info panels + the SVdP/KofC/etc. nearest-charity lookups.
          VITE_PERPLEXITY_PROXY_URL: ${{ secrets.VITE_PERPLEXITY_PROXY_URL }}
        run: npm run build

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
